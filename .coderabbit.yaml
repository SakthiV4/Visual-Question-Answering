# CodeRabbit Configuration for VQA Accessibility Project

# Language settings
language: en-US

# Review settings
reviews:
  # Request changes for critical issues
  request_changes_workflow: coderabbit
  
  # Auto-approve minor changes
  auto_approve:
    - "chore: update dependencies"
    - "docs: update README"
    - "style: formatting"
  
  # Review focus areas
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  
  # Path-specific instructions
  path_instructions:
    - path: "pwa/**"
      instructions: |
        - Check for accessibility (ARIA labels, keyboard navigation)
        - Verify voice command implementation
        - Ensure responsive design
        - Check for security issues (XSS, CSRF)
    
    - path: "backend/**"
      instructions: |
        - Check for security vulnerabilities
        - Verify input validation
        - Check error handling
        - Ensure CORS is properly configured
    
    - path: "src/models/**"
      instructions: |
        - Check for model loading efficiency
        - Verify GPU/CPU handling
        - Check memory management
        - Ensure proper error handling

# Chat settings
chat:
  auto_reply: true

# Knowledge base
knowledge_base:
  - "This is an accessibility-focused PWA for visually impaired users"
  - "Voice-first design is critical - all features must work without screen"
  - "WCAG 2.1 Level AA compliance is required"
  - "Using pretrained BLIP-VQA model (no training needed)"
  - "Target: UN SDG Goal 10 - Reduced Inequalities"

# Tone
tone_instructions: "Be constructive and focus on accessibility, security, and user experience. Prioritize issues that affect visually impaired users."
