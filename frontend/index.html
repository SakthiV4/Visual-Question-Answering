<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI-powered Visual Question Answering for Visually Impaired">
    <meta name="theme-color" content="#4F46E5">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Icons -->
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-512.png">
    
    <title>VQA Assistant - Visual Aid for the Visually Impaired</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #4F46E5;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #6B7280;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .camera-section {
            position: relative;
            margin-bottom: 30px;
        }

        #video {
            width: 100%;
            border-radius: 16px;
            display: none;
            background: #000;
        }

        #canvas {
            width: 100%;
            border-radius: 16px;
            display: none;
        }

        .placeholder {
            width: 100%;
            height: 300px;
            background: linear-gradient(135deg, #667eea20 0%, #764ba220 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6B7280;
            font-size: 1.1em;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        button {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #F3F4F6;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #E5E7EB;
        }

        .question-section {
            margin-bottom: 25px;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px;
            border: 2px solid #E5E7EB;
            border-radius: 12px;
            font-size: 1em;
            transition: border 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .voice-btn {
            margin-top: 15px;
            background: #10B981;
            color: white;
        }

        .voice-btn:hover {
            background: #059669;
        }

        .voice-btn.listening {
            background: #EF4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .answer-section {
            background: linear-gradient(135deg, #667eea10 0%, #764ba210 100%);
            padding: 25px;
            border-radius: 16px;
            margin-top: 25px;
            display: none;
        }

        .answer-section.show {
            display: block;
        }

        .answer-label {
            color: #6B7280;
            font-size: 0.9em;
            margin-bottom: 8px;
        }

        .answer-text {
            color: #1F2937;
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .metadata {
            display: flex;
            gap: 20px;
            font-size: 0.85em;
            color: #6B7280;
        }

        .loading {
            text-align: center;
            color: #667eea;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #FEE2E2;
            color: #991B1B;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            display: none;
        }

        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>VQA Assistant</h1>
        <p class="subtitle">AI-Powered Visual Aid for the Visually Impaired</p>

        <!-- Camera Section -->
        <div class="camera-section">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
            <div id="placeholder" class="placeholder">
                📷 Camera will appear here
            </div>
        </div>

        <!-- Camera Controls -->
        <div class="controls">
            <button id="startCamera" class="btn-primary">Start Camera</button>
            <button id="capturePhoto" class="btn-secondary" disabled>Capture Photo</button>
        </div>

        <!-- Question Input -->
        <div class="question-section">
            <input type="text" id="questionInput" placeholder="Type your question here..." />
            <button id="voiceBtn" class="btn-primary voice-btn">🎤 Ask with Voice</button>
            <button id="submitBtn" class="btn-primary" style="margin-top: 15px;">Get Answer</button>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Processing your question...</p>
        </div>

        <!-- Error Message -->
        <div id="error" class="error"></div>

        <!-- Answer Section -->
        <div id="answerSection" class="answer-section">
            <div class="answer-label">Answer:</div>
            <div id="answerText" class="answer-text"></div>
            <div class="metadata">
                <span id="processingTime"></span>
                <span id="confidence"></span>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
